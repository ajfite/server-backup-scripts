# Drop-in for Ubuntu's apt-daily-upgrade.service (unattended-upgrades). An upgrade
# restarts services, which kills a cleanup or backup that is still running. This waits
# for any that are running and does nothing when none are.
[Unit]
After=mastodon-clean.service server-backup-vaultwarden.service
After=server-backup-databases.service server-backup-weekly.service server-update.service
